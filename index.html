<title>Wardrobe AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling screen, fixed bottom tab bar; photos large, labels styled like garment care tags */
:root {
  --bg: #EDEEF2;
  --surface: #FFFFFF;
  --ink: #15151C;
  --muted: #646675;
  --line: #D6D8E0;
  --accent: #2234D8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DEE1FB;
  --good: #1D7A4C;
  --warn: #A3540D;
  --bad: #B3261E;
  --photo: #E3E4EA;
  --shadow: 0 1px 2px rgba(20,22,40,.06), 0 6px 20px rgba(20,22,40,.06);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-tag: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111218; --surface: #1B1C25; --ink: #F1F1F6; --muted: #A2A4B4; --line: #2E3040;
    --accent: #8C97FF; --accent-ink: #0E1030; --accent-soft: #262B55;
    --good: #5CCB8F; --warn: #E4A35A; --bad: #F2867E; --photo: #252633;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111218; --surface: #1B1C25; --ink: #F1F1F6; --muted: #A2A4B4; --line: #2E3040;
  --accent: #8C97FF; --accent-ink: #0E1030; --accent-soft: #262B55;
  --good: #5CCB8F; --warn: #E4A35A; --bad: #F2867E; --photo: #252633;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.logo { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; place-items: center; }
.logo i::after { content: ""; width: 10px; height: 6px; border: 2px solid var(--accent-ink); border-bottom: 0; border-radius: 6px 6px 0 0; }
.chip-status { font-family: var(--f-tag); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.chip-status.on { color: var(--good); border-color: currentColor; }

main { padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 22px; padding-block: 18px 8px; }
.screen-title { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-h h2 { font-size: 17px; font-weight: 700; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }

/* tags (care-label style) */
.tag { font-family: var(--f-tag); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.tag .sw { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(127,127,127,.4); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.example-badge { position: absolute; top: 8px; left: 8px; font-family: var(--f-tag); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--muted); border-radius: 4px; padding: 2px 6px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }

/* home */
.hero { background: var(--ink); color: var(--bg); border-radius: 20px; padding: 22px 20px; display: grid; gap: 14px; }
.hero h1 { font-family: var(--f-display); font-size: 24px; line-height: 1.15; letter-spacing: -.02em; }
.hero p { margin: 0; opacity: .8; max-width: 52ch; }
.hero .btn.primary { justify-self: start; }
.steps { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 14px; }
.steps li::before { content: counter(s); font-family: var(--f-tag); font-size: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; opacity: .8; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.quick b { font-size: 15px; }
.quick span { font-size: 12.5px; color: var(--muted); }

/* wardrobe */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.filters::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill small { font-family: var(--f-tag); font-weight: 500; opacity: .6; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { position: relative; background: var(--surface); border-radius: var(--r); overflow: hidden; border: 0; padding: 0; text-align: left; display: grid; box-shadow: var(--shadow); }
.card .ph { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; object-fit: cover; background: var(--photo); display: block; }
.card .meta { padding: 9px 10px 11px; display: grid; gap: 5px; min-width: 0; }
.card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { background: var(--accent-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

.fab { position: fixed; z-index: 15; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); border: 0; box-shadow: 0 8px 24px rgba(34,52,216,.35); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; }

/* generator */
.form { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-family: var(--f-tag); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
select, input[type="text"], textarea { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; font-size: 16px; }
textarea { resize: none; min-height: 46px; max-height: 140px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 10px 4px; font-size: 13px; font-weight: 600; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pin { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: 10px; padding: 8px; }
.pin img { width: 44px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--photo); }
.pin span { flex: 1; font-size: 14px; min-width: 0; }

.look { background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.look-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.look-head h3 { font-size: 16px; }
.score { font-family: var(--f-tag); font-size: 12px; white-space: nowrap; border-radius: 6px; padding: 3px 8px; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(96px, 1fr); gap: 8px; overflow-x: auto; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.strip img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; background: var(--photo); }
.strip figcaption { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
.why li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.why li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.note { font-size: 13.5px; color: var(--muted); }
.err { color: var(--bad); font-size: 14px; }

/* chat */
.chat { display: grid; gap: 12px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.ai { justify-self: start; background: var(--surface); border-bottom-left-radius: 4px; }
.msg.ai.loading { color: var(--muted); }
.ai-looks { display: grid; gap: 10px; }
.suggest { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
.composer { position: fixed; z-index: 14; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.composer .wrap { display: flex; gap: 8px; padding-block: 8px; align-items: end; }
.composer textarea { flex: 1; }
.composer .btn { min-width: 46px; padding: 0 14px; }
.chat-pad { height: 70px; }


/* matrix lab */
.plane { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-tag); font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--photo); border: 1px solid var(--ink); }
.mini { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.mini::-webkit-scrollbar { display: none; }
.mini button { flex: none; width: 84px; border: 0; background: none; padding: 0; text-align: left; font-size: 11.5px; color: var(--muted); display: grid; gap: 4px; }
.mini img { width: 84px; height: 100px; object-fit: cover; border-radius: 8px; background: var(--photo); }
.sw-inline { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; border: 1px solid rgba(127,127,127,.4); vertical-align: -1px; }

.tv { font-family: var(--f-tag); font-size: 14px; display: grid; gap: 4px; text-align: center; padding: 8px; border-radius: 10px; background: var(--bg); overflow-wrap: anywhere; }
.tv-f { font-size: 15px; color: var(--accent); }
.coef { font-family: var(--f-tag); font-size: 14px; line-height: 2.6; text-align: center; }
.coef input { width: 58px; min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); text-align: center; font-family: var(--f-tag); font-size: 16px; }
.me-row { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.me-row img { width: 96px; height: 120px; object-fit: cover; border-radius: 10px; background: var(--photo); }
a.btn { text-decoration: none; color: inherit; }
.shop { border: 1px dashed var(--line); box-shadow: none; }
.shop .look-head { flex-direction: column; align-items: start; }
.shop .score { white-space: normal; }
/* nav */
.nav { position: fixed; z-index: 16; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav a { display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--accent); }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,10,20,.45); display: grid; align-items: end; }
.sheet { background: var(--surface); border-radius: 20px 20px 0 0; max-height: 92%; overflow-y: auto; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet .wrap { display: grid; gap: 14px; padding-block: 10px 0; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 0; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-h h2 { font-family: var(--f-display); font-size: 19px; }
.x { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--bg); display: grid; place-items: center; text-align: center; gap: 6px; padding: 26px 12px; color: var(--muted); }
.drop b { color: var(--ink); }
.preview { position: relative; }
.preview img { width: 100%; max-height: 340px; object-fit: contain; border-radius: var(--r); background: var(--photo); display: block; }
.preview .btn { position: absolute; right: 8px; bottom: 8px; min-height: 36px; padding: 0 12px; font-size: 13px; }
.colors { display: flex; flex-wrap: wrap; gap: 8px; }
.colors button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.color-name { font-size: 13px; color: var(--muted); }
.confirm { background: var(--bg); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="logo"><i aria-hidden="true"></i>Wardrobe AI</div>
    <span class="chip-status" id="status">loading</span>
  </div>
</header>

<main id="main" class="wrap"></main>

<button class="fab" id="fab" aria-label="Add item" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="composer" id="composer" hidden>
  <div class="wrap">
    <textarea id="chat-input" rows="1" placeholder="e.g. an outfit for class on a cold day"></textarea>
    <button class="btn primary" id="chat-send" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

</div>

<nav class="nav" aria-label="Sections">
  <div class="wrap">

    <a href="#wardrobe" data-tab="wardrobe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6a2 2 0 1 1 2-2M12 6v2L3 15h18l-9-7"/><path d="M5 15v4h14v-4"/></svg>Wardrobe</a>

  </div>
</nav>

<script>
(() => {
"use strict";

/* ---------- reference data ---------- */
const CATS = [
  { id: "tops", label: "Tops", one: "top" },
  { id: "trousers", label: "Trousers", one: "trousers" },

  { id: "shoes", label: "Shoes", one: "shoes" },
  { id: "accessories", label: "Accessories", one: "accessory" },
];
/* n: neutral colour = zero vector on the colour plane; h: hue angle (°), c: vector length (saturation) */
const COLORS = [
  { id: "black", label: "black", hex: "#1B1B1E", n: true },
  { id: "white", label: "white", hex: "#F7F7F4", n: true },
  { id: "grey", label: "grey", hex: "#9A9CA3", n: true },
  { id: "beige", label: "beige", hex: "#D8C3A0", n: true },
  { id: "brown", label: "brown", hex: "#7A4E2D", n: true },
  { id: "navy", label: "navy", hex: "#1F2B4D", n: true },
  { id: "denim", label: "denim", hex: "#5B7DB1", n: true },
  { id: "khaki", label: "khaki", hex: "#7C7B4E", n: true },
  { id: "blue", label: "blue", hex: "#2F5BD3", h: 225, c: 1 },
  { id: "lightblue", label: "light blue", hex: "#9CC3EC", h: 210, c: 0.6 },
  { id: "green", label: "green", hex: "#2F8A4E", h: 140, c: 0.9 },
  { id: "red", label: "red", hex: "#D23A2E", h: 5, c: 1 },
  { id: "burgundy", label: "burgundy", hex: "#6E1E2C", h: 345, c: 0.7 },
  { id: "pink", label: "pink", hex: "#EDA3B7", h: 340, c: 0.6 },
  { id: "yellow", label: "yellow", hex: "#F0C93A", h: 50, c: 1 },
  { id: "orange", label: "orange", hex: "#E5772A", h: 25, c: 1 },
  { id: "purple", label: "purple", hex: "#6C4AB6", h: 265, c: 0.9 },

/* ---------- screen data ---------- */
const ownItems = () => state.items.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const usingExamples = () => state.items.length === 0;
const wardrobe = () => (usingExamples() ? EXAMPLES : ownItems());
const itemById = (id) => wardrobe().find((x) => x.id === id) || state.items.find((x) => x.id === id);
const itemName = (it) => it.name || `${cap(COL[it.color]?.label || "")} ${CAT[it.category]?.one || ""}`.trim();
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

/* ---------- linear algebra ---------- */
// A linear transformation of the plane is given by four coefficients [a, b, c, d]: T(x; y) = (a·x + b·y; c·x + d·y)
const LA = {
  mul: (M, v) => [M[0] * v[0] + M[1] * v[1], M[2] * v[0] + M[3] * v[1]],
  det: (M) => M[0] * M[3] - M[1] * M[2],
  rot: (deg) => { const t = (deg * Math.PI) / 180; return [Math.cos(t), -Math.sin(t), Math.sin(t), Math.cos(t)]; },
  dot: (u, v) => u[0] * v[0] + u[1] * v[1],
  len: (v) => Math.hypot(v[0], v[1]),
  dist: (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]),
  lerp: (A, B, t) => A.map((x, i) => x + (B[i] - x) * t),
  cos: (u, v) => { const l = LA.len(u) * LA.len(v); return l ? LA.dot(u, v) / l : 0; },
};
const fmt = (x) => (Math.abs(x) < 0.005 ? "0" : x.toFixed(2).replace(/\.?0+$/, "").replace("-", "−"));

// Colour → vector on the colour plane. Neutral colours are the zero vector.
function colorVec(id) {
  const c = COL[id]; if (!c || c.n) return [0, 0];
  const t = (c.h * Math.PI) / 180; return [c.c * Math.cos(t), c.c * Math.sin(t)];
}
// Harmony schemes = rotations of the colour vector by angle θ
const HARMONY = [
  { deg: 0, w: 0.8, label: "monochrome", rule: "by 0°" },
  { deg: 30, w: 0.9, label: "analogous", rule: "by ±30°" },
  { deg: -30, w: 0.9, label: "analogous", rule: "by ±30°" },
  { deg: 120, w: 0.75, label: "triadic", rule: "by ±120°" },
  { deg: -120, w: 0.75, label: "triadic", rule: "by ±120°" },
  { deg: 180, w: 0.95, label: "complementary", rule: "by 180°" },
];
function harmonyOf(a, b) {
  const u = colorVec(a), v = colorVec(b);
  if (!LA.len(u) || !LA.len(v)) return { score: 1, kind: null };
  let best = { score: 0, kind: null };
  for (const H of HARMONY) {
    const s = H.w * Math.pow(Math.max(0, LA.cos(LA.mul(LA.rot(H.deg), u), v)), 8);
    if (s > best.score) best = { score: s, kind: H };
  }
  return { score: 0.15 + 0.85 * best.score, kind: best.score > 0.3 ? best.kind : null };
}

// Item → vector on the style plane: x = formality, y = warmth (from −1 to 1)
const FORMALITY = { sport: -0.9, street: -0.5, casual: -0.2, smart: 0.4, classic: 0.85 };
const WARMTH = { summer: -0.8, spring: -0.15, all: 0, autumn: 0.35, winter: 0.85 };
const OCC_X = { sport: -0.85, everyday: -0.25, study: -0.2, party: -0.05, date: 0.3, work: 0.65 };
const WEATHER_Y = { cold: 0.75, cool: 0.3, warm: -0.2, hot: -0.7 };
const clamp1 = (x) => Math.max(-1, Math.min(1, x));
function itemVec(it) {
  const x = FORMALITY[it.style] ?? 0;
  let y = WARMTH[it.season] ?? 0;
  if (it.category === "jackets") y += 0.3;
  return [clamp1(x), clamp1(y)];
}
function outfitVec(items) {
  let sx = 0, sy = 0, sw = 0;
  for (const it of items) { const w = it.category === "accessories" ? 0.5 : 1; const v = itemVec(it); sx += v[0] * w; sy += v[1] * w; sw += w; }
  return sw ? [sx / sw, sy / sw] : [0, 0];
}
const contextTarget = (opts) => opts.target || [OCC_X[opts.occasion] ?? 0, WEATHER_Y[opts.weather] ?? 0];
function seasonFromY(y) { return y > 0.55 ? "winter" : y > 0.1 ? "autumn" : y > -0.45 ? "spring" : "summer"; }
function weatherFromY(y) { return y > 0.5 ? "cold" : y > 0.05 ? "cool" : y > -0.45 ? "warm" : "hot"; }

/* ---------- outfit generator (vectors + rules) ---------- */
const pairScore = (a, b) => harmonyOf(a, b).score;
function seasonOk(item, season) { return item.season === "all" || item.season === season; }
function occasionOk(item, occ) {
  if (item.category === "shoes" || item.category === "accessories") return occ !== "sport" || item.style === "sport" || item.occasion === "sport";
  return item.occasion === occ || (OCC_STYLES[occ] || []).includes(item.style);
}
function styleClash(styles) {
  const s = new Set(styles);
  return (s.has("sport") && (s.has("classic") || s.has("smart"))) || (s.has("classic") && s.has("street"));
}

function scoreOutfit(items, opts) {
  const colors = items.map((i) => i.color);
  let pairs = 0, sum = 0;
  for (let i = 0; i < colors.length; i++) for (let j = i + 1; j < colors.length; j++) { sum += pairScore(colors[i], colors[j]); pairs++; }
  const harmony = pairs ? sum / pairs : 1;
  const accents = colors.filter((c) => !COL[c]?.n).length;
  const styles = items.filter((i) => i.category !== "accessories").map((i) => i.style);
  const uniqueStyles = new Set(styles);
  const vec = outfitVec(items), target = contextTarget(opts);
  const fit = Math.max(0, 1 - LA.dist(vec, target) / 1.6);
  let score = 22 + harmony * 33 + fit * 33;
  if (uniqueStyles.size === 1) score += 10; else if (!styleClash(styles)) score += 5; else score -= 12;
  if (accents > 2) score -= 10;
  if (opts.occasion) score += items.filter((i) => i.occasion === opts.occasion).length * 1.5;
  if (opts.prefer) score += items.filter((i) => opts.prefer.includes(i.color)).length * 4;
  if (opts.avoid) score -= items.filter((i) => opts.avoid.includes(i.color)).length * 6;
  score -= items.filter((i) => !seasonOk(i, opts.season)).length * 6;
  return { score: Math.max(0, Math.min(100, Math.round(score))), harmony, accents, uniqueStyles, styles, vec, target, fit };
}

function explain(items, s, opts) {
  const out = [];
  out.push(`Outfit vector v = (${fmt(s.vec[0])}; ${fmt(s.vec[1])}), target t = (${fmt(s.target[0])}; ${fmt(s.target[1])}), distance |v − t| = ${fmt(LA.dist(s.vec, s.target))}.`);
  const neutrals = [...new Set(items.filter((i) => COL[i.color]?.n).map((i) => COL[i.color].label))];
  const accentIds = [...new Set(items.filter((i) => COL[i.color] && !COL[i.color].n).map((i) => i.color))];
  const accent = accentIds.map((id) => COL[id].label);
  if (accent.length === 0) out.push(`All colours are neutral (${neutrals.join(", ")}): they are zero vectors, so they go with anything.`);
  else if (accent.length === 1) out.push(`One coloured vector (${accent[0]}), the rest are zero: an accent without overload.`);
  else {
    const h = harmonyOf(accentIds[0], accentIds[1]);
    if (h.kind) out.push(`${cap(accent[0])} and ${accent[1]}: ${h.kind.label}. Rotating one colour vector ${h.kind.rule} almost lands on the other.`);
    else out.push(`${cap(accent.join(" and "))}: no rotation lines up their vectors, so this is a bold mix.`);
  }
  if (s.uniqueStyles.size === 1) out.push(`Every item is in one style: ${STY[s.styles[0]]?.label}.`);
  else if (!styleClash(s.styles)) out.push(`The styles ${[...s.uniqueStyles].map((x) => STY[x]?.label).join(" + ")} mix well.`);
  else out.push("The styles clash a little, so this one is more of an experiment.");
  if (items.some((i) => i.category === "jackets") && (opts.weather === "cold" || opts.weather === "cool")) out.push(`Added a jacket because it is ${opts.weather === "cold" ? "cold" : "cool"}.`);
  const off = items.filter((i) => !seasonOk(i, opts.season));
  if (off.length) out.push(`${itemName(off[0])} is a bit off-season, but nothing else fits.`);
  else out.push(`Every item suits the season: ${SEA[opts.season].label}.`);
  return out;
}

function generate(opts, count = 3) {
  const all = wardrobe();
  const pool = (cats, strict) => all.filter((i) => cats.includes(i.category) && (!strict || ((!opts.occasion || occasionOk(i, opts.occasion)) && seasonOk(i, opts.season))));
  const pick = (cats) => { const s = pool(cats, true); return (s.length ? s : pool(cats, false)).slice(0, 14); };
  let tops = pick(["tops"]), bottoms = pick(BOTTOMS), shoes = pick(["shoes"]);
  const needJacket = opts.weather === "cold" || opts.weather === "cool";
  let jackets = needJacket ? pick(["jackets"]) : [];
  const accs = pick(["accessories"]);
  const pin = opts.pin ? all.find((i) => i.id === opts.pin) : null;
  if (pin) {
    if (pin.category === "tops") tops = [pin];
    else if (BOTTOMS.includes(pin.category)) bottoms = [pin];
    else if (pin.category === "shoes") shoes = [pin];
    else if (pin.category === "jackets") jackets = [pin];
  }
  const missing = [];
  if (!tops.length) missing.push("a top");
  if (!bottoms.length) missing.push("trousers or jeans");
  if (!shoes.length) missing.push("shoes");
  if (missing.length) return { error: `To build an outfit, add to your wardrobe: ${missing.join(", ")}.` };

  const combos = [];
  const jacketOpts = jackets.length ? jackets : [null];
  for (const t of tops) for (const b of bottoms) for (const sh of shoes) for (const j of jacketOpts) {
    let items = [t, b, sh]; if (j) items.splice(1, 0, j);
    let s = scoreOutfit(items, opts);
    let best = { items, s };
    for (const a of accs) { // add an accessory only if it does not hurt the outfit
      const withA = [...items, a]; const sa = scoreOutfit(withA, opts);
      if (sa.score >= best.s.score) best = { items: withA, s: sa };
    }
    combos.push(best);
  }
  if (pin && pin.category === "accessories") combos.forEach((c) => { if (!c.items.includes(pin)) { c.items.push(pin); c.s = scoreOutfit(c.items, opts); } });
  combos.sort((a, b) => b.s.score - a.s.score);
  const chosen = [];
  for (const c of combos) {
    if (chosen.length >= count) break;
    const ids = new Set(c.items.map((i) => i.id));
    const tooSimilar = chosen.some((o) => o.items.filter((i) => ids.has(i.id)).length >= Math.min(ids.size, o.items.length) - (pin ? 0 : 1));
    if (!tooSimilar) chosen.push(c);
  }
  if (chosen.length < count) for (const c of combos) { if (chosen.length >= count) break; if (!chosen.includes(c)) chosen.push(c); }
  const names = ["Main pick", "Alternative", "Bolder"];
  return {
    looks: chosen.map((c, i) => ({
      title: `${opts.occasion ? cap(OCC[opts.occasion].label) : "Outfit near T(v)"} · ${names[i] || "Option " + (i + 1)}`,
      itemIds: c.items.map((x) => x.id), score: c.s.score, why: explain(c.items, c.s, opts), occasion: opts.occasion,
    })),
  };
}

/* ---------- AI ---------- */
function wardrobeForAI() {
  return wardrobe().map((i) => ({ id: i.id, name: itemName(i), category: CAT[i.category]?.label, color: COL[i.color]?.label, season: SEA[i.season]?.label, style: STY[i.style]?.label, occasion: OCC[i.occasion]?.label, vector: itemVec(i).map((x) => +x.toFixed(2)) }));
}
function aiErrorText(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") return "AI is not available here, so I will answer using the rules.";
  if (c === "rate_limited") return "Too many requests in a row. Wait a minute.";
  if (c === "cancelled") return "";
  return "AI did not answer. Try again a bit later.";
}

async function classifyPhoto(blob) {
  const prompt = `The photo shows one clothing item. Identify its attributes and pick values STRICTLY from the lists.
category: ${CATS.map((c) => c.id).join(", ")}
color (main colour): ${COLORS.map((c) => c.id).join(", ")}
season: ${SEASONS.map((c) => c.id).join(", ")}

name: a short English name (2-3 words), for example "Black trousers".
Return only JSON: {"category":"","color":"","season":"","style":"","occasion":"","name":""}`;
  const r = await state.sample.json(prompt, { images: [blob], modelTier: "quick" });
  const ok = (v, map) => (typeof v === "string" && map[v] ? v : null);
  return { category: ok(r.category, CAT), color: ok(r.color, COL), season: ok(r.season, SEA), style: ok(r.style, STY), occasion: ok(r.occasion, OCC), name: typeof r.name === "string" ? r.name.slice(0, 40) : "" };
}

/* local stylist without AI: understands simple phrases */
function parseRequest(text) {
  const t = text.toLowerCase();
  const opts = { occasion: "everyday", season: currentSeason(), weather: SEASON_WEATHER[currentSeason()], pin: null };
  const occRules = [[/universit|college|class|school|lecture|study|универ|учеб|учёб|школ/, "study"], [/work|office|interview|meeting|работ|офис/, "work"], [/date|romantic|dinner|свидан/, "date"], [/party|club|birthday|celebrat|вечерин/, "party"], [/sport|gym|workout|training|run|спорт/, "sport"]];
  for (const [re, o] of occRules) if (re.test(t)) { opts.occasion = o; break; }
  if (/cold|freez|winter|snow|холод/.test(t)) { opts.weather = "cold"; opts.season = /winter|snow|freez/.test(t) ? "winter" : opts.season; }
  else if (/cool|rain|wind|chilly/.test(t)) opts.weather = "cool";
  else if (/hot|summer|heat/.test(t)) { opts.weather = "hot"; opts.season = "summer"; }
  else if (/warm|spring/.test(t)) opts.weather = "warm";
  const catRules = [[/trouser|pants|slacks|брюк/, ["trousers"]], [/jean|denim|джинс/, ["jeans"]], [/jacket|coat|blazer|bomber|parka/, ["jackets"]], [/sneaker|trainer|boot|shoe|loafer/, ["shoes"]], [/t-shirt|tee|shirt|sweater|jumper|turtleneck|hoodie|top|blouse/, ["tops"]], [/bag|backpack|scarf|cap|hat/, ["accessories"]]];
  let cats = null; for (const [re, c] of catRules) if (re.test(t)) { cats = c; break; }
  const color = COLORS.find((c) => t.includes(c.label));
  if (cats || color) {
    const cand = wardrobe().find((i) => (!cats || cats.includes(i.category)) && (!color || i.color === color.id));
    if (cand) opts.pin = cand.id;
  }
  const count = /three|3/.test(t) ? 3 : /two|2/.test(t) ? 2 : /\bone\b|1/.test(t) ? 1 : 2;
  return { opts, count };
}

/* ---------- photos: compress on the phone ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { res(img); URL.revokeObjectURL(url); };
    img.onerror = () => { rej(new Error("bad")); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
async function compress(file) {
  if (!file.type.startsWith("image/")) throw new Error("This is not an image. Choose a JPG, PNG or WebP photo.");
  if (file.size > 20 * 1024 * 1024) throw new Error("The photo is over 20 MB. Choose a smaller file.");
  let img; try { img = await loadImage(file); } catch (e) { throw new Error("Could not open the photo. Try a JPG or PNG."); }
  let max = 760, q = 0.78, dataUrl = "", blob = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    dataUrl = c.toDataURL("image/jpeg", q);
    blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (dataUrl.length < 170000) break;
    max = Math.round(max * 0.82); q = Math.max(0.55, q - 0.06);
  }
  return { dataUrl, blob };
}

// What is missing: adding item w to an outfit of n items with vector v makes the mean (n·v + w)/(n + 1).
// For it to equal the target t, we need w = (n + 1)·t − n·v.
function shopSuggestion(opts) {
  const t = contextTarget(opts);
  const r = generate(opts, 1);
  const all = wardrobe();
  const missingCat = ["tops", "jeans", "shoes"].find((c) => c === "jeans" ? !all.some((i) => BOTTOMS.includes(i.category)) : !all.some((i) => i.category === c));
  let w = t, n = 0, v = null, look = [];
  if (!r.error) {
    look = r.looks[0].itemIds.map(itemById).filter((i) => i && i.category !== "accessories");
    n = look.length; v = outfitVec(look);
    w = [clamp1((n + 1) * t[0] - n * v[0]), clamp1((n + 1) * t[1] - n * v[1])];
  }
  const cat = missingCat || ((opts.weather === "cold" || opts.weather === "cool") && w[1] > 0.45 && !all.some((i) => i.category === "jackets") ? "jackets" : "tops");
  const noun = {
    tops: w[1] > 0.3 ? "sweater" : w[0] > 0.3 ? "shirt" : "t-shirt", trousers: "trousers", jeans: w[0] > 0.3 ? "trousers" : "jeans",
    jackets: w[1] > 0.6 ? "coat" : "jacket", shoes: w[0] > 0.3 ? "boots" : "sneakers", accessories: "bag",
  }[cat];
  let color = (opts.prefer || []).find((c) => !look.some((i) => i.color === c));
  if (!color) {
    const accent = look.find((i) => LA.len(colorVec(i.color)));
    if (accent) { // complementary colour = rotation by 180°
      const target = LA.mul(LA.rot(180), colorVec(accent.color));
      color = COLORS.filter((c) => !c.n).sort((a, b) => LA.cos(colorVec(b.id), target) - LA.cos(colorVec(a.id), target))[0].id;
    } else color = w[1] > 0.2 ? "beige" : "white";
  }
  const styleId = Object.entries(FORMALITY).sort((a, b) => Math.abs(a[1] - w[0]) - Math.abs(b[1] - w[0]))[0][0];
  const query = `${styleId === "classic" ? "classic " : styleId === "sport" ? "sport " : ""}${COL[color].label} ${noun}`;
  return { query, w, n, v, t, color, styleId, season: seasonFromY(w[1]), missing: !!missingCat };
}

// Linear transformation T(x; y) = (a·x + b·y; c·x + d·y), coefficients stored as [a, b, c, d]
const PRESETS = [
  { id: "I", label: "No change", M: [1, 0, 0, 1], why: "The identity transformation: T(v) = v." },
  { id: "season", label: "Summer ↔ winter", M: [1, 0, 0, -1], why: "Reflection in the x-axis: warmth changes sign. A warm outfit becomes light and vice versa, while formality stays the same." },
  { id: "style", label: "Casual ↔ classic", M: [-1, 0, 0, 1], why: "Reflection in the y-axis: a formal outfit becomes casual and vice versa." },
  { id: "stretch", label: "Bolder style", M: [1.6, 0, 0, 1], why: "Stretch along the x-axis by 1.6: casual gets more relaxed, classic gets more formal." },

state.lab = { M: [1, 0, 0, 1], shown: [1, 0, 0, 1], preset: "I", result: null, color: null };
let labAnim = 0;

function labBase() {

    const a1 = LA.mul(M, [k, -1.5]), a2 = LA.mul(M, [k, 1.5]), b1 = LA.mul(M, [-1.5, k]), b2 = LA.mul(M, [1.5, k]);

  }
  const dots = wardrobe().map((it) => { const v = itemVec(it); return `<circle cx="${v[0]}" cy="${-v[1]}" r="0.05" fill="${COL[it.color]?.hex || "#999"}" stroke="var(--ink)" stroke-width="0.012" opacity=".9"><title>${esc(itemName(it))}</title></circle>`; }).join("");

    <rect x="-1.75" y="-1.75" width="3.5" height="3.5" fill="var(--surface)"/>

const pt = (v) => `(${fmt(v[0])}; ${fmt(v[1])})`;

function render() {

/* ---------- navigation ---------- */
const TABS = ["home", "wardrobe", "looks", "lab", "chat"];
function route() {

}

/* ---------- item sheet ---------- */
const sheetRoot = document.getElementById("sheet-root");
let draft = null, draftBlob = null;

function openItem(id) {

function readDraftFields() {

  draft.category = v("f-cat") || draft.category; draft.season = v("f-sea") || draft.season;

document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !draft) { if (draft && !draft.img) closeSheet(); return; }
  readDraftFields();
  try { const { dataUrl, blob } = await compress(f); draft.img = dataUrl; draftBlob = blob; drawSheet(); }
  catch (err) { drawSheet({ error: err.message }); }
});

sheetRoot.addEventListener("click", async (e) => {
  if (e.target.id === "overlay") return closeSheet();
  const b = e.target.closest("button"); if (!b || !draft) return;
  if (b.hasAttribute("data-close")) return closeSheet();
  if (b.dataset.color) {
    draft.color = b.dataset.color;
    sheetRoot.querySelectorAll("[data-color]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.color === draft.color));
    document.getElementById("color-name").textContent = COL[draft.color].label; return;
  }
  const act = b.dataset.act; readDraftFields();
  if (act === "photo") document.getElementById("file").click();
  else if (act === "ask-del") drawSheet({ confirmDelete: true });
  else if (act === "cancel-del") drawSheet();
  else if (act === "del") { const name = itemName(draft); try { await removeItem(draft.id); closeSheet(); toast(`"${name}" deleted`); } catch (err) { drawSheet({ error: "Could not delete. Check your connection and try again." }); } }
  else if (act === "pin") { state.gen.pin = draft.id; state.results = generate(state.gen); closeSheet(); go("looks"); }
  else if (act === "add-own") { closeSheet(); openItem(null); }
  else if (act === "ai-tag") {
    drawSheet({ busy: true });
    try {
      const r = await classifyPhoto(draftBlob);
      for (const k of ["category", "color", "season", "style", "occasion"]) if (r[k]) draft[k] = r[k];
      if (r.name && !draft.name) draft.name = r.name;

    } catch (err) { drawSheet({ aiNote: aiErrorText(err) || "Could not recognise the item. Fill in the fields by hand." }); }

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && draft) closeSheet(); });

/* ---------- screen clicks ---------- */
main.addEventListener("click", async (e) => {

  if (b.dataset.act === "add") return openItem(null);

  if (b.dataset.act === "lab-find") {
    const { v } = state.lab.base || labBase();
    const Av = LA.mul(state.lab.M, v), t = [clamp1(Av[0]), clamp1(Av[1])];
    const opts = { occasion: null, season: seasonFromY(t[1]), weather: weatherFromY(t[1]), target: t, pin: null };
    const r = generate(opts, 2);
    state.lab.result = r.error ? r : { ...r, note: `Target T(v) = (${fmt(t[0])}; ${fmt(t[1])}). From warmth y = ${fmt(t[1])} the season is ${SEA[opts.season].label}. Below are real outfits from your closet whose vectors are closest to the target.` };
    render();
    requestAnimationFrame(() => document.getElementById("lab-out")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    return;
  }
  if (b.dataset.save) {
    const l = JSON.parse(b.dataset.save);
    b.disabled = true;
    try { await saveLook({ ...l, id: newId(), createdAt: Date.now() }); toast("Outfit saved"); b.textContent = "Saved"; }
    catch (err) { b.disabled = false; toast("Could not save the outfit"); }
    return;
  }
  if (b.dataset.unsave) { try { await removeLook(b.dataset.unsave); toast("Outfit removed"); } catch (err) { toast("Could not remove it"); } }
});
main.addEventListener("input", (e) => {
  const m = /^m-([abcd])$/.exec(e.target.id || ""); if (!m) return;
  const n = parseFloat(String(e.target.value).replace(",", "."));
  if (!Number.isFinite(n)) return;
  const M = state.lab.M.slice(); M["abcd".indexOf(m[1])] = Math.max(-5, Math.min(5, n));
  state.lab.M = M; state.lab.shown = M.slice(); state.lab.preset = null; state.lab.result = null;
  main.querySelectorAll("[data-preset]").forEach((x) => x.setAttribute("aria-pressed", "false"));
  const note = e.target.closest(".form").querySelector("p.note"); if (note) note.textContent = "Your own transformation: change the coefficients and watch the grid move.";
  document.getElementById("lab-out").innerHTML = "";
  updateLab();
});
main.addEventListener("change", (e) => {
  if (e.target.id === "g-occ") { state.gen.occasion = e.target.value; state.shop = null; }
  if (e.target.id === "g-sea") { state.gen.season = e.target.value; state.shop = null; }
});
main.addEventListener("submit", (e) => {
  if (e.target.id !== "gen-form") return;
  e.preventDefault();
  state.shop = null; state.results = generate(state.gen); render();
  requestAnimationFrame(() => document.getElementById("gen-out")?.scrollIntoView({ behavior: "smooth", block: "start" }));
});
document.getElementById("fab").addEventListener("click", () => openItem(null));
document.getElementById("selfie").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !state.sample) return;
  const M = state.me;
  Object.assign(M, { busy: true, error: "", profile: null, result: null });
  let blob;
  try { const c = await compress(f); M.photo = c.dataUrl; blob = c.blob; } catch (err) { M.busy = false; M.error = err.message; return render(); }
  render();
  try {
    const prof = await analyzeSelfie(blob);
    if (prof.noPerson) M.error = "There is no person visible in the photo. Try one that shows you at least from the waist up.";
    else {
      M.profile = prof;
      const opts = meOpts(prof);
      M.result = { opts, r: generate(opts, 2), shop: shopSuggestion(opts) };
    }
  } catch (err) { M.error = aiErrorText(err) || "Could not read the photo."; }
  M.busy = false; render();
});

/* ---------- chat ---------- */
const input = document.getElementById("chat-input");
let busy = false;
async function send(text) {
  text = (text || "").trim(); if (!text || busy) return;
  busy = true; input.value = ""; input.style.height = "";
  try { await askStylist(text); } finally { busy = false; }
}
document.getElementById("chat-send").addEventListener("click", () => send(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });

let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}

route();
setStatus();
initStorage();
initAI();
})();
</script>
