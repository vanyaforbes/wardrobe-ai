<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F8F6F1">
<meta name="description" content="Wardrobe AI: a personal stylist that builds outfits only from the clothes you already own.">
<title>Wardrobe AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Premium fashion / luxury minimalism: warm ivory surfaces, hairline borders, serif display type, photos first */
:root {
  --bg: #F8F6F1;
  --bg-2: #EEEAE2;
  --card: #FFFFFF;
  --ink: #292929;
  --ink-2: #57534D;
  --muted: #88847D;
  --accent: #A39483;
  --line: #E4DFD6;
  --line-2: #D2CBBF;
  --bad: #9C4A3C;
  --good: #5F7257;
  --f-display: "Instrument Serif", "Times New Roman", Georgia, serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 6px;
  --r-lg: 10px;
  --nav-h: 66px;
  --head-h: 60px;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 768px) { .wrap { padding-left: 32px; padding-right: 32px; } }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(248,246,241,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: var(--head-h); }
.logo { display: flex; align-items: baseline; gap: 7px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.logo b { font-family: var(--f-display); font-weight: 400; font-size: 25px; letter-spacing: -.01em; line-height: 1; }
.logo span { font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.status { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
.status.on::before { background: var(--good); }
.topnav { display: none; gap: 30px; }
.topnav a { position: relative; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; padding: 6px 0; transition: color .2s; }
.topnav a:hover { color: var(--ink); }
.topnav a[aria-current="page"] { color: var(--ink); }
.topnav a[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: var(--ink); }

/* ---------- bottom nav (mobile & tablet) ---------- */
.nav { position: fixed; z-index: 16; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); max-width: 560px; }
.nav a { position: relative; display: grid; place-items: center; align-content: center; gap: 4px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; transition: color .2s; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 50%; width: 22px; height: 1.5px; margin-left: -11px; background: var(--ink); }

@media (min-width: 1024px) {
  .topnav { display: flex; }
  .nav { display: none; }
  :root { --nav-h: 0px; --head-h: 72px; }
}

main { padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.screen { display: grid; gap: 40px; padding-block: 26px 12px; min-width: 0; }
.screen > * { min-width: 0; }
@media (min-width: 768px) { .screen { gap: 56px; padding-top: 44px; } }

/* ---------- type ---------- */
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.display { font-family: var(--f-display); font-size: clamp(38px, 9vw, 64px); line-height: 1.02; letter-spacing: -.015em; }
.display em { font-style: italic; color: var(--ink-2); }
.page-title { font-family: var(--f-display); font-size: clamp(36px, 7vw, 52px); line-height: 1.05; letter-spacing: -.01em; }
.lede { color: var(--ink-2); max-width: 56ch; margin-top: 10px; font-size: 15px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 18px; }
.sec-h h2 { font-family: var(--f-display); font-size: 27px; line-height: 1.1; }
.sec-h h2 small { font-family: var(--f-body); font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-left: 8px; vertical-align: 4px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--ink); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; border-bottom: 1px solid var(--line-2); white-space: nowrap; transition: border-color .2s; }
.link:hover { border-color: var(--ink); }
.note { font-size: 13.5px; color: var(--muted); }
.err { color: var(--bad); font-size: 14px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--card); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--ink); transition: background .2s, border-color .2s, color .2s; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 11.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--line-2); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r); border: 1px solid var(--line); background: rgba(255,255,255,.92); color: var(--ink); transition: border-color .2s, color .2s; }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- tags ---------- */
.tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); flex: none; display: inline-block; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.badge { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; background: rgba(255,255,255,.92); color: var(--ink-2); border-radius: 3px; padding: 3px 7px; }

/* ---------- home ---------- */
.hello { display: grid; gap: 14px; }
.hello .lede { margin-top: 0; }
.hello-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 4px; display: grid; gap: 2px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 16px; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.stylist-cta { display: grid; gap: 18px; background: var(--bg-2); border-radius: var(--r-lg); padding: 26px 22px; }
.stylist-cta h2 { font-family: var(--f-display); font-size: 32px; line-height: 1.08; }
.stylist-cta p { color: var(--ink-2); max-width: 46ch; }
.fake-input { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 0 8px 0 16px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--card); color: var(--muted); text-align: left; transition: border-color .2s; }
.fake-input:hover { border-color: var(--ink); }
.fake-input i { width: 38px; height: 38px; border-radius: var(--r); background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.fake-input i svg { width: 16px; height: 16px; }
@media (min-width: 768px) { .stylist-cta { grid-template-columns: 1fr 1fr; align-items: center; padding: 40px; gap: 32px; } }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 42%); gap: 14px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin-inline: -16px; padding-inline: 16px; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
@media (min-width: 768px) { .rail { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; } }
@media (min-width: 1024px) { .rail { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.looks-rail { grid-auto-columns: minmax(250px, 80%); }
@media (min-width: 768px) { .looks-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .looks-rail { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- wardrobe ---------- */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 768px) { .cats { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; } }
.cat { display: grid; justify-items: center; align-content: center; gap: 6px; padding: 14px 4px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; transition: border-color .2s, background .2s; }
.cat:hover { border-color: var(--line-2); }
.cat svg { width: 26px; height: 26px; color: var(--ink-2); }
.cat b { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.cat[aria-pressed="true"] svg, .cat[aria-pressed="true"] span { color: var(--bg-2); }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toolbar .count { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sort { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sort select { width: auto; min-height: 38px; padding: 0 30px 0 12px; font-size: 13px; letter-spacing: 0; text-transform: none; background-position: right 10px center; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 16px; } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 20px; } }
.group + .group { margin-top: 44px; }
.item { position: relative; display: grid; gap: 10px; min-width: 0; }
.item .media { position: relative; display: block; width: 100%; padding: 0; border: 0; background: var(--bg-2); border-radius: var(--r); overflow: hidden; aspect-ratio: 3 / 4; }
.item .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.item:hover .media img { transform: scale(1.03); }
.item .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 1; transition: opacity .2s; }
@media (hover: hover) { .item .acts { opacity: 0; } .item:hover .acts, .item:focus-within .acts { opacity: 1; } }
.item .info { display: grid; gap: 3px; min-width: 0; }
.item .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { display: grid; justify-items: center; gap: 14px; text-align: center; color: var(--muted); padding: 48px 16px; border: 1px dashed var(--line-2); border-radius: var(--r-lg); }
.empty h3 { font-family: var(--f-display); font-size: 26px; color: var(--ink); }
.banner { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 18px; background: var(--bg-2); border-radius: var(--r-lg); font-size: 14px; color: var(--ink-2); }

/* ---------- lookbook ---------- */
.lookbook { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; }
@media (min-width: 640px) { .lookbook { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 20px; } }
@media (min-width: 1024px) { .lookbook { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 24px; } }
.look { display: grid; gap: 14px; min-width: 0; align-content: start; }
.collage { display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr; gap: 4px; aspect-ratio: 4 / 5; width: 100%; padding: 0; border: 0; background: var(--card); border-radius: var(--r); overflow: hidden; }
.collage .c { position: relative; overflow: hidden; background: var(--bg-2); min-height: 0; }
.collage .c img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.collage .c:first-child { grid-row: 1 / 3; }
.collage.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.collage.n1 .c:first-child { grid-row: auto; }
.collage.n2 { grid-template-rows: 1fr; }
.collage.n2 .c:first-child { grid-row: auto; }
.collage.n4 .c:nth-child(n+4) { display: none; }
.collage .more { position: absolute; right: 8px; bottom: 8px; background: rgba(255,255,255,.94); color: var(--ink); font-size: 11px; font-weight: 600; letter-spacing: .08em; padding: 3px 8px; border-radius: 3px; }
.look:hover .collage .c img { transform: scale(1.025); }
.look-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.match { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.look-title { font-family: var(--f-display); font-size: 26px; line-height: 1.1; margin-top: -4px; }
.look-actions { display: flex; gap: 8px; }
.look-actions .btn { flex: 1; }
.why { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.why li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; }
.why li::before { content: ""; width: 8px; height: 1px; margin-top: 11px; background: var(--accent); }

/* ---------- forms ---------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; display: grid; gap: 16px; }
@media (min-width: 768px) { .panel { padding: 24px; } }
.field { display: grid; gap: 7px; min-width: 0; }
.field > label, .field > .lbl { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gen { display: grid; gap: 16px; }
@media (min-width: 900px) { .gen { grid-template-columns: 1fr 1fr 1.6fr auto; align-items: end; } .gen .two { display: contents; } }
select, input[type="text"], textarea { width: 100%; min-height: 46px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--card); padding: 10px 12px; font-size: 16px; transition: border-color .2s; }
select:hover, input[type="text"]:hover, textarea:hover { border-color: var(--muted); }
select { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23292929' stroke-width='1.3'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; }
textarea { resize: none; max-height: 140px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; background: var(--card); }
.seg button { border: 0; background: transparent; min-height: 44px; padding: 0 4px; font-size: 13px; font-weight: 500; border-left: 1px solid var(--line); transition: background .2s; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--bg); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pin { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: var(--r); padding: 8px; }
.pin img { width: 42px; height: 54px; object-fit: cover; border-radius: 4px; background: var(--bg-2); }
.pin span { flex: 1; font-size: 14px; min-width: 0; }
.gen .pin { grid-column: 1 / -1; }

.shop { display: grid; gap: 14px; padding: 22px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); }
.shop h3 { font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.shop .q { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }

/* ---------- stylist ---------- */
.stylist { display: grid; gap: 28px; }
@media (min-width: 1024px) { .stylist { grid-template-columns: minmax(0, 1fr) 340px; gap: 48px; align-items: start; } .side { position: sticky; top: calc(var(--head-h) + 24px); } }
.side { display: grid; gap: 20px; }
.persona { display: flex; gap: 14px; align-items: center; }
.mono { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; flex: none; }
.persona b { display: block; font-weight: 600; }
.persona div span { font-size: 13px; color: var(--muted); }
.mini-rail { display: grid; grid-auto-flow: column; grid-auto-columns: 72px; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.mini-rail::-webkit-scrollbar { display: none; }
@media (min-width: 1024px) { .mini-rail { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-columns: auto; } }
.mini-rail button { padding: 0; border: 0; background: var(--bg-2); border-radius: 4px; overflow: hidden; aspect-ratio: 3 / 4; transition: opacity .2s; }
.mini-rail button:hover { opacity: .8; }
.mini-rail img { width: 100%; height: 100%; object-fit: cover; }
.prompts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.prompts button { text-align: left; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--card); display: grid; gap: 6px; transition: border-color .2s; min-width: 0; }
.prompts button:hover { border-color: var(--ink); }
.prompts span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.prompts b { font-weight: 500; font-size: 14px; line-height: 1.35; }
.thread { display: grid; gap: 22px; }
.m-user { justify-self: end; max-width: 82%; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.m-ai { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.m-ai .mono { width: 32px; height: 32px; font-size: 16px; }
.m-ai .body { display: grid; gap: 14px; min-width: 0; }
.m-ai .text { font-family: var(--f-display); font-size: 21px; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.m-ai.loading .text { color: var(--muted); font-style: italic; }
.m-ai .lookbook { gap: 28px; }
@media (min-width: 640px) { .m-ai .lookbook { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .m-ai .lookbook { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.composer { position: fixed; z-index: 14; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); background: rgba(248,246,241,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.composer .wrap { padding-block: 10px; }

async function initStorage() {

    if (!window.claude || !window.claude.use) { clearTimeout(timer); fallback(); return; }

      if (first) { clearTimeout(timer); first = false; state.mode = "db"; setStatus(); }
      state.items = snap.docs.map((s) => ({ id: s.id, ...s.data() }));
      render();
    }, () => { clearTimeout(timer); fallback(); });

      render();
    }, () => {});

  return {

      const images = [];

      if (!r.ok) { const e = new Error("ai"); e.code = r.status === 429 ? "rate_limited" : "upstream"; throw e; }

async function initAI() {
  try {
    if (!window.claude || !window.claude.use) {
      if (AI_URL) { state.sample = proxySample(); state.canSeeImages = true; render(); }
      return;
    }
    const s = await window.claude.use("sample");
    if (!s) return;
    state.sample = s;
    const lim = await s.limits().catch(() => null);
    state.canSeeImages = !!(lim && lim.images);
    render();
  } catch (e) {}
}

/* ---------- screen data ---------- */
const ownItems = () => state.items.slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
const usingExamples = () => state.items.length === 0;
const wardrobe = () => (usingExamples() ? EXAMPLES : ownItems());
const itemById = (id) => wardrobe().find((x) => x.id === id) || state.items.find((x) => x.id === id);
const itemName = (it) => it.name || `${cap(COL[it.color]?.label || "")} ${CAT[it.category]?.one || ""}`.trim();
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

/* ---------- colour and style matching (internal scoring) ---------- */
const V = {
  mul: (M, v) => [M[0] * v[0] + M[1] * v[1], M[2] * v[0] + M[3] * v[1]],
  rot: (deg) => { const t = (deg * Math.PI) / 180; return [Math.cos(t), -Math.sin(t), Math.sin(t), Math.cos(t)]; },
  dot: (u, v) => u[0] * v[0] + u[1] * v[1],
  len: (v) => Math.hypot(v[0], v[1]),
  dist: (u, v) => Math.hypot(u[0] - v[0], u[1] - v[1]),
  cos: (u, v) => { const l = V.len(u) * V.len(v); return l ? V.dot(u, v) / l : 0; },
};
// Colour → point on the colour wheel. Neutral colours sit in the centre and go with anything.
function colorVec(id) {
  const c = COL[id]; if (!c || c.n) return [0, 0];
  const t = (c.h * Math.PI) / 180; return [c.c * Math.cos(t), c.c * Math.sin(t)];
}
const HARMONY = [
  { deg: 0, w: 0.8, label: "tonal" },
  { deg: 30, w: 0.9, label: "analogous" },
  { deg: -30, w: 0.9, label: "analogous" },
  { deg: 120, w: 0.75, label: "triadic" },
  { deg: -120, w: 0.75, label: "triadic" },
  { deg: 180, w: 0.95, label: "complementary" },
];
function harmonyOf(a, b) {
  const u = colorVec(a), v = colorVec(b);
  if (!V.len(u) || !V.len(v)) return { score: 1, kind: null };
  let best = { score: 0, kind: null };
  for (const H of HARMONY) {
    const s = H.w * Math.pow(Math.max(0, V.cos(V.mul(V.rot(H.deg), u), v)), 8);
    if (s > best.score) best = { score: s, kind: H };
  }
  return { score: 0.15 + 0.85 * best.score, kind: best.score > 0.3 ? best.kind : null };
}

// Style profile of an item: formality and warmth, each from −1 to 1
const FORMALITY = { sport: -0.9, street: -0.5, casual: -0.2, smart: 0.4, classic: 0.85 };
const WARMTH = { summer: -0.8, spring: -0.15, all: 0, autumn: 0.35, winter: 0.85 };
const OCC_X = { sport: -0.85, everyday: -0.25, study: -0.2, party: -0.05, date: 0.3, work: 0.65 };
const WEATHER_Y = { cold: 0.75, cool: 0.3, warm: -0.2, hot: -0.7 };
const clamp1 = (x) => Math.max(-1, Math.min(1, x));
function itemVec(it) {
  const x = FORMALITY[it.style] ?? 0;
  let y = WARMTH[it.season] ?? 0;
  if (it.category === "jackets") y += 0.3;
  return [clamp1(x), clamp1(y)];
}
function outfitVec(items) {
  let sx = 0, sy = 0, sw = 0;
  for (const it of items) { const w = it.category === "accessories" ? 0.5 : 1; const v = itemVec(it); sx += v[0] * w; sy += v[1] * w; sw += w; }
  return sw ? [sx / sw, sy / sw] : [0, 0];
}
const contextTarget = (opts) => opts.target || [OCC_X[opts.occasion] ?? 0, WEATHER_Y[opts.weather] ?? 0];
function seasonFromY(y) { return y > 0.55 ? "winter" : y > 0.1 ? "autumn" : y > -0.45 ? "spring" : "summer"; }

/* ---------- outfit generator ---------- */
const pairScore = (a, b) => harmonyOf(a, b).score;
function seasonOk(item, season) { return item.season === "all" || item.season === season; }
function occasionOk(item, occ) {
  if (item.category === "shoes" || item.category === "accessories") return occ !== "sport" || item.style === "sport" || item.occasion === "sport";
  return item.occasion === occ || (OCC_STYLES[occ] || []).includes(item.style);
}
function styleClash(styles) {
  const s = new Set(styles);
  return (s.has("sport") && (s.has("classic") || s.has("smart"))) || (s.has("classic") && s.has("street"));
}

function scoreOutfit(items, opts) {
  const colors = items.map((i) => i.color);
  let pairs = 0, sum = 0;
  for (let i = 0; i < colors.length; i++) for (let j = i + 1; j < colors.length; j++) { sum += pairScore(colors[i], colors[j]); pairs++; }
  const harmony = pairs ? sum / pairs : 1;
  const accents = colors.filter((c) => !COL[c]?.n).length;
  const styles = items.filter((i) => i.category !== "accessories").map((i) => i.style);
  const uniqueStyles = new Set(styles);
  const vec = outfitVec(items), target = contextTarget(opts);
  const fit = Math.max(0, 1 - V.dist(vec, target) / 1.6);
  let score = 22 + harmony * 33 + fit * 33;
  if (uniqueStyles.size === 1) score += 10; else if (!styleClash(styles)) score += 5; else score -= 12;
  if (accents > 2) score -= 10;
  if (opts.occasion) score += items.filter((i) => i.occasion === opts.occasion).length * 1.5;
  if (opts.prefer) score += items.filter((i) => opts.prefer.includes(i.color)).length * 4;
  if (opts.avoid) score -= items.filter((i) => opts.avoid.includes(i.color)).length * 6;
  score -= items.filter((i) => !seasonOk(i, opts.season)).length * 6;
  return { score: Math.max(0, Math.min(100, Math.round(score))), harmony, accents, uniqueStyles, styles, vec, target, fit };
}

function explain(items, s, opts) {
  const out = [];
  const neutrals = [...new Set(items.filter((i) => COL[i.color]?.n).map((i) => COL[i.color].label))];
  const accentIds = [...new Set(items.filter((i) => COL[i.color] && !COL[i.color].n).map((i) => i.color))];
  const accent = accentIds.map((id) => COL[id].label);
  if (accent.length === 0) out.push(`A calm neutral palette (${neutrals.join(", ")}): everything goes together.`);
  else if (accent.length === 1) out.push(`One accent colour, ${accent[0]}, on a neutral base: expressive without being loud.`);
  else {
    const h = harmonyOf(accentIds[0], accentIds[1]);
    if (h.kind) out.push(`${cap(accent[0])} and ${accent[1]} are ${h.kind.label} colours, so they work together.`);
    else out.push(`${cap(accent.join(" and "))} make a bold colour mix.`);
  }
  if (s.uniqueStyles.size === 1) out.push(`One consistent style: ${STY[s.styles[0]]?.label}.`);
  else if (!styleClash(s.styles)) out.push(`${cap([...s.uniqueStyles].map((x) => STY[x]?.label).join(" and "))} pieces mix well.`);
  else out.push("The styles contrast a little, so this one is more of an experiment.");
  if (items.some((i) => i.category === "jackets") && (opts.weather === "cold" || opts.weather === "cool")) out.push(`A layer on top, because it is ${opts.weather === "cold" ? "cold" : "cool"} outside.`);
  const off = items.filter((i) => !seasonOk(i, opts.season));
  if (off.length) out.push(`${itemName(off[0])} is slightly off-season, but nothing else fits as well.`);
  else out.push(`Every piece suits ${SEA[opts.season].label}.`);
  return out;
}

function generate(opts, count = 3) {
  const all = wardrobe();
  const pool = (cats, strict) => all.filter((i) => cats.includes(i.category) && (!strict || ((!opts.occasion || occasionOk(i, opts.occasion)) && seasonOk(i, opts.season))));
  const pick = (cats) => { const s = pool(cats, true); return (s.length ? s : pool(cats, false)).slice(0, 14); };
  let tops = pick(["tops"]), bottoms = pick(BOTTOMS), dresses = pick(["dresses"]), shoes = pick(["shoes"]);
  const needJacket = opts.weather === "cold" || opts.weather === "cool";
  let jackets = needJacket ? pick(["jackets"]) : [];
  const accs = pick(["accessories"]);
  const pin = opts.pin ? all.find((i) => i.id === opts.pin) : null;
  if (pin) {
    if (pin.category === "tops") { tops = [pin]; dresses = []; }
    else if (BOTTOMS.includes(pin.category)) { bottoms = [pin]; dresses = []; }
    else if (pin.category === "dresses") { dresses = [pin]; tops = []; bottoms = []; }
    else if (pin.category === "shoes") shoes = [pin];
    else if (pin.category === "jackets") jackets = [pin];
  }
  const missing = [];
  if (!(tops.length && bottoms.length) && !dresses.length) {
    if (!tops.length) missing.push("a top");
    if (!bottoms.length) missing.push("trousers or jeans");
  }
  if (!shoes.length) missing.push("shoes");
  if (missing.length) return { error: `To build an outfit, add to your wardrobe: ${missing.join(", ")}.` };

  const bases = [];
  for (const t of tops) for (const b of bottoms) bases.push([t, b]);
  for (const d of dresses) bases.push([d]);
  const combos = [];
  const jacketOpts = jackets.length ? jackets : [null];
  for (const base of bases) for (const sh of shoes) for (const j of jacketOpts) {
    const items = [base[0]]; if (j) items.push(j); items.push(...base.slice(1), sh);
    let best = { items, s: scoreOutfit(items, opts) };
    for (const a of accs) { // add an accessory only if it does not hurt the outfit
      const withA = [...items, a]; const sa = scoreOutfit(withA, opts);
      if (sa.score >= best.s.score) best = { items: withA, s: sa };
    }
    combos.push(best);
  }
  if (pin && pin.category === "accessories") combos.forEach((c) => { if (!c.items.includes(pin)) { c.items.push(pin); c.s = scoreOutfit(c.items, opts); } });
  combos.sort((a, b) => b.s.score - a.s.score);
  const chosen = [];
  for (const c of combos) {
    if (chosen.length >= count) break;
    const ids = new Set(c.items.map((i) => i.id));
    const tooSimilar = chosen.some((o) => o.items.filter((i) => ids.has(i.id)).length >= Math.min(ids.size, o.items.length) - (pin ? 0 : 1));
    if (!tooSimilar) chosen.push(c);
  }
  if (chosen.length < count) for (const c of combos) { if (chosen.length >= count) break; if (!chosen.includes(c)) chosen.push(c); }
  const names = ["The main pick", "The alternative", "The bolder one"];
  return {
    looks: chosen.map((c, i) => ({
      title: `${opts.occasion ? cap(OCC[opts.occasion].label) : "Outfit"} · ${names[i] || "Option " + (i + 1)}`,
      itemIds: c.items.map((x) => x.id), score: c.s.score, why: explain(c.items, c.s, opts), occasion: opts.occasion, season: opts.season,
    })),
  };
}

/* ---------- AI ---------- */
function wardrobeForAI() {
  return wardrobe().map((i) => ({ id: i.id, name: itemName(i), category: CAT[i.category]?.label, color: COL[i.color]?.label, season: SEA[i.season]?.label, style: STY[i.style]?.label, occasion: OCC[i.occasion]?.label }));
}
function aiErrorText(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") return "AI is not available here, so I answered using the styling rules.";
  if (c === "rate_limited") return "Too many requests in a row. Wait a minute.";
  if (c === "cancelled") return "";
  return "AI did not answer. Try again a bit later.";
}

async function classifyPhoto(blob) {
  const prompt = `The photo shows one clothing item. Identify its attributes and pick values STRICTLY from the lists.
category: ${CATS.map((c) => c.id).join(", ")}
color (main colour): ${COLORS.map((c) => c.id).join(", ")}
season: ${SEASONS.map((c) => c.id).join(", ")}
style: ${STYLES.map((c) => c.id).join(", ")}
occasion: ${OCCASIONS.map((c) => c.id).join(", ")}
name: a short English name (2-3 words), for example "Black trousers".
Return only JSON: {"category":"","color":"","season":"","style":"","occasion":"","name":""}`;
  const r = await state.sample.json(prompt, { images: [blob], modelTier: "quick" });
  const ok = (v, map) => (typeof v === "string" && map[v] ? v : null);
  return { category: ok(r.category, CAT), color: ok(r.color, COL), season: ok(r.season, SEA), style: ok(r.style, STY), occasion: ok(r.occasion, OCC), name: typeof r.name === "string" ? r.name.slice(0, 40) : "" };
}

/* local stylist without AI: understands simple phrases */
function parseRequest(text) {
  const t = text.toLowerCase();
  const opts = { occasion: "everyday", season: currentSeason(), weather: SEASON_WEATHER[currentSeason()], pin: null };
  const occRules = [[/universit|college|class|school|lecture|study|универ|учеб|учёб|школ/, "study"], [/work|office|interview|meeting|работ|офис/, "work"], [/date|romantic|dinner|свидан/, "date"], [/party|club|birthday|celebrat|вечерин/, "party"], [/sport|gym|workout|training|run|спорт/, "sport"]];
  for (const [re, o] of occRules) if (re.test(t)) { opts.occasion = o; break; }
  if (/cold|freez|winter|snow|холод/.test(t)) { opts.weather = "cold"; opts.season = /winter|snow|freez/.test(t) ? "winter" : opts.season; }
  else if (/cool|rain|wind|chilly/.test(t)) opts.weather = "cool";
  else if (/hot|summer|heat/.test(t)) { opts.weather = "hot"; opts.season = "summer"; }
  else if (/warm|spring/.test(t)) opts.weather = "warm";
  const catRules = [[/dress|платье/, ["dresses"]], [/trouser|pants|slacks|брюк/, ["trousers"]], [/jean|denim|джинс/, ["jeans"]], [/jacket|coat|blazer|bomber|parka/, ["jackets"]], [/sneaker|trainer|boot|shoe|loafer/, ["shoes"]], [/t-shirt|tee|shirt|sweater|jumper|turtleneck|hoodie|top|blouse/, ["tops"]], [/bag|backpack|scarf|cap|hat/, ["accessories"]]];
  let cats = null; for (const [re, c] of catRules) if (re.test(t)) { cats = c; break; }
  const color = COLORS.find((c) => t.includes(c.label));
  if (cats || color) {
    const cand = wardrobe().find((i) => (!cats || cats.includes(i.category)) && (!color || i.color === color.id));
    if (cand) opts.pin = cand.id;
  }
  const count = /three|3/.test(t) ? 3 : /two|2/.test(t) ? 2 : /\bone\b|1/.test(t) ? 1 : 2;
  return { opts, count };
}

async function askStylist(text) {
  state.chat.push({ role: "user", text });
  const pending = { role: "ai", text: "Looking through your wardrobe…", loading: true };
  state.chat.push(pending); render(); scrollChat();
  const { opts, count } = parseRequest(text);
  const ruled = generate(opts, 3);
  if (state.sample) {
    try {
      const history = state.chat.filter((m) => !m.loading).slice(-8).map((m) => `${m.role === "user" ? "User" : "Stylist"}: ${m.text}`).join("\n");
      const prompt = `You are the AI stylist of the Wardrobe AI app. Answer in English, briefly and warmly (2-4 sentences), like a personal stylist at a fashion house.
Rules:
- Use ONLY the items from the wardrobe below and refer to them by id. Never invent items.
- Suggest new purchases only if the user explicitly asks. If the wardrobe lacks something for the request, say honestly what is missing.
- An outfit = top + bottom (trousers or jeans) + shoes, or a dress + shoes; add outerwear when it is cold and an optional accessory.
- In "why", explain in plain fashion language (colours, silhouette, occasion, weather). No maths.
Today is ${new Date().toLocaleDateString("en-US")}, season: ${SEA[currentSeason()].label}.
Wardrobe: ${JSON.stringify(wardrobeForAI())}
Hint from the colour and style compatibility algorithm (you may build on it): ${JSON.stringify((ruled.looks || []).map((l) => ({ item_ids: l.itemIds, score: l.score })))}
Conversation:
${history}
Reply to the user's last message. Return only JSON:
{"reply":"reply text","outfits":[{"title":"short name","item_ids":["id",...],"why":"why it works, 1-2 sentences"}]}
If no outfits are needed, return an empty outfits list.`;
      const r = await state.sample.json(prompt, { cache: false });
      const looks = (Array.isArray(r.outfits) ? r.outfits : []).slice(0, 4).map((o) => {
        const ids = (Array.isArray(o.item_ids) ? o.item_ids : []).filter((id) => itemById(id));
        const items = ids.map(itemById);
        return { title: String(o.title || "Outfit").slice(0, 60), itemIds: ids, score: items.length >= 2 ? scoreOutfit(items, opts).score : null, why: o.why ? [String(o.why)] : [], occasion: opts.occasion, season: opts.season };
      }).filter((l) => l.itemIds.length >= 2);
      Object.assign(pending, { text: String(r.reply || "Done."), looks, loading: false, by: "ai" });
      render(); scrollChat(); return;
    } catch (e) {
      const msg = aiErrorText(e);
      if (e && e.code === "cancelled") { state.chat.pop(); render(); return; }
      pending.note = msg;
    }
  }
  if (ruled.error) Object.assign(pending, { text: ruled.error, loading: false });
  else {
    const looks = ruled.looks.slice(0, count);
    const pinIt = opts.pin ? itemById(opts.pin) : null;
    const lead = pinIt ? `Here ${looks.length === 1 ? "is a look" : "are looks"} built around your ${itemName(pinIt).toLowerCase()}` : `Here ${looks.length === 1 ? "is a look" : "are looks"} for ${OCC[opts.occasion].label === "everyday" ? "every day" : OCC[opts.occasion].label}`;
    Object.assign(pending, { text: `${lead}, styled for ${WEATHER.find((w) => w.id === opts.weather).label.toLowerCase()} weather. Everything is from your wardrobe.`, looks, loading: false, by: "rules" });
  }
  render(); scrollChat();
}
function scrollChat() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); }

/* ---------- photos: compress on the device ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { res(img); URL.revokeObjectURL(url); };
    img.onerror = () => { rej(new Error("bad")); URL.revokeObjectURL(url); };
    img.src = url;
  });
}
async function compress(file) {
  if (!file.type.startsWith("image/")) throw new Error("This is not an image. Choose a JPG, PNG or WebP photo.");
  if (file.size > 20 * 1024 * 1024) throw new Error("The photo is over 20 MB. Choose a smaller file.");
  let img; try { img = await loadImage(file); } catch (e) { throw new Error("Could not open the photo. Try a JPG or PNG."); }
  let max = 760, q = 0.78, dataUrl = "", blob = null;
  for (let attempt = 0; attempt < 5; attempt++) {
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    dataUrl = c.toDataURL("image/jpeg", q);
    blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (dataUrl.length < 170000) break;
    max = Math.round(max * 0.82); q = Math.max(0.55, q - 0.06);
  }
  return { dataUrl, blob };
}

/* ---------- render helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = document.getElementById("main");
const opt = (list, val) => list.map((x) => `<option value="${x.id}" ${x.id === val ? "selected" : ""}>${esc(cap(x.label))}</option>`).join("");
const LOOKS = new Map(); let lookSeq = 0;
const regLook = (l) => { const k = "L" + ++lookSeq; LOOKS.set(k, l); return k; };

function itemCard(it, { actions = true } = {}) {
  const c = COL[it.color];
  const own = !it.example;
  return `<article class="item">
    <button class="media" data-open="${esc(it.id)}" aria-label="Open ${esc(itemName(it))}">${it.example && actions ? '<span class="badge">Example</span>' : ""}<img src="${it.img}" alt="${esc(itemName(it))}" loading="lazy"></button>
    ${actions && own ? `<div class="acts"><button class="icon-btn" data-open="${esc(it.id)}" aria-label="Edit ${esc(itemName(it))}" title="Edit">${IC.edit}</button><button class="icon-btn danger" data-del="${esc(it.id)}" aria-label="Delete ${esc(itemName(it))}" title="Delete">${IC.trash}</button></div>` : ""}
    <div class="info"><div class="name">${esc(itemName(it))}</div>
      <div class="tags"><span class="tag">${esc(CAT[it.category]?.label || "Other")}</span>${c ? `<span class="tag"><span class="sw" style="background:${c.hex}"></span>${esc(c.label)}</span>` : ""}</div></div>
  </article>`;
}
function collage(items) {
  const main3 = items.filter((i) => i.category !== "accessories");
  const ordered = [...main3, ...items.filter((i) => i.category === "accessories")];
  const n = ordered.length;
  const shown = ordered.slice(0, 3);
  const cls = n === 1 ? "n1" : n === 2 ? "n2" : "";
  return `<div class="collage ${cls}">${shown.map((i, k) => `<div class="c"><img src="${i.img}" alt="${esc(itemName(i))}" loading="lazy">${k === 2 && n > 3 ? `<span class="more">+${n - 3}</span>` : ""}</div>`).join("")}</div>`;
}
function lookMeta(l) {
  const parts = [];
  if (l.occasion && OCC[l.occasion]) parts.push(cap(OCC[l.occasion].label));
  if (l.season && SEA[l.season]) parts.push(cap(SEA[l.season].label));
  return parts.join(" · ") || "Look";
}
function lookTitle(l) { const p = String(l.title || "Outfit").split(" · "); return p.length > 1 ? p.slice(1).join(" · ") : p[0]; }
function lookCard(l, { savable = true, saved = false } = {}) {
  const items = l.itemIds.map(itemById).filter(Boolean);
  if (!items.length) return "";
  const k = regLook({ ...l, _saved: saved, _savable: savable });
  return `<article class="look">
    <button class="collage-btn" data-look="${k}" aria-label="Open look details" style="padding:0;border:0;background:none;display:block;width:100%">${collage(items)}</button>
    <div class="look-meta"><span class="eyebrow">${esc(lookMeta(l))}</span>${l.score != null ? `<span class="match" title="Colour, style and weather compatibility">${l.score}% match</span>` : ""}</div>
    <h3 class="look-title">${esc(lookTitle(l))}</h3>
    <div class="look-actions"><button class="btn sm" data-look="${k}">Details</button>${saveBtn(l, k, { saved, savable })}</div>
  </article>`;
}
function saveBtn(l, k, { saved, savable }) {
  if (saved) return `<button class="btn sm danger" data-unsave="${esc(l.id)}">Remove</button>`;
  if (savable) return `<button class="btn sm primary" data-save="${k}">Save look</button>`;
  return "";
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
}

function sortItems(list) {
  const l = list.slice();
  if (state.sort === "old") l.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  else if (state.sort === "name") l.sort((a, b) => itemName(a).localeCompare(itemName(b)));
  else if (state.sort === "color") { const idx = (c) => COLORS.findIndex((x) => x.id === c); l.sort((a, b) => idx(a.color) - idx(b.color)); }
  else l.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return l;
}

const UNDERTONE = { warm: "warm", cool: "cool", neutral: "neutral" };
const CONTRAST = { low: "low", medium: "medium", high: "high" };

async function analyzeSelfie(blob) {
  const prompt = `You are a stylist. The photo shows a person who wants help choosing clothes. Do not try to identify who it is, and do not judge their looks or body.
From the photo, determine:
- undertone: skin undertone, one of warm, cool, neutral
- contrast: contrast between hair, skin and eyes, one of low, medium, high
- style_x: a number from -1 (sporty, relaxed) to 1 (formal), based on how the person is dressed in the photo
- warmth_y: a number from -1 (dressed very lightly) to 1 (dressed very warmly)
- best_colors: up to 5 colours that will suit this person, only ids from the list
- avoid_colors: up to 3 colours better kept away from the face, only ids from the list
- summary: 2 short sentences in English on why these colours suit them
Colours: ${COLORS.map((c) => `${c.id} (${c.label})`).join(", ")}
If there is no person in the photo, return {"no_person": true}.
Otherwise return only JSON: {"undertone":"","contrast":"","style_x":0,"warmth_y":0,"best_colors":[],"avoid_colors":[],"summary":""}`;
  const r = await state.sample.json(prompt, { images: [blob] });
  if (r && r.no_person) return { noPerson: true };
  const num = (x) => (Number.isFinite(+x) ? clamp1(+x) : 0);
  const ids = (a, n) => (Array.isArray(a) ? a.filter((x) => COL[x]).slice(0, n) : []);
  return {
    undertone: UNDERTONE[r.undertone] ? r.undertone : "neutral", contrast: CONTRAST[r.contrast] ? r.contrast : "medium",
    p: [num(r.style_x), num(r.warmth_y)], best: ids(r.best_colors, 5), avoid: ids(r.avoid_colors, 3),
    summary: typeof r.summary === "string" ? r.summary.slice(0, 400) : "",
  };
}
function meOpts(profile) {
  const t = contextTarget(state.gen);
  const target = [0.5 * profile.p[0] + 0.5 * t[0], 0.5 * profile.p[1] + 0.5 * t[1]];
  return { occasion: state.gen.occasion, season: state.gen.season, weather: state.gen.weather, target, t, prefer: profile.best, avoid: profile.avoid, pin: null };
}

// "What to buy": the piece that would bring the best look closest to the occasion's ideal style.
function shopSuggestion(opts) {
  const t = contextTarget(opts);
  const r = generate(opts, 1);
  const all = wardrobe();
  const missingCat = ["tops", "jeans", "shoes"].find((c) => c === "jeans" ? !all.some((i) => BOTTOMS.includes(i.category)) : !all.some((i) => i.category === c));
  let w = t, n = 0, look = [];
  if (!r.error) {
    look = r.looks[0].itemIds.map(itemById).filter((i) => i && i.category !== "accessories");
    n = look.length; const v = outfitVec(look);
    w = [clamp1((n + 1) * t[0] - n * v[0]), clamp1((n + 1) * t[1] - n * v[1])];
  }
  const cat = missingCat || ((opts.weather === "cold" || opts.weather === "cool") && w[1] > 0.45 && !all.some((i) => i.category === "jackets") ? "jackets" : "tops");
  const noun = {
    tops: w[1] > 0.3 ? "sweater" : w[0] > 0.3 ? "shirt" : "t-shirt", trousers: "trousers", jeans: w[0] > 0.3 ? "trousers" : "jeans",
    jackets: w[1] > 0.6 ? "coat" : "jacket", shoes: w[0] > 0.3 ? "boots" : "sneakers", accessories: "bag",
  }[cat];
  let color = (opts.prefer || []).find((c) => !look.some((i) => i.color === c));
  if (!color) {
    const accent = look.find((i) => V.len(colorVec(i.color)));
    if (accent) { // the complementary colour sits opposite on the colour wheel
      const target = V.mul(V.rot(180), colorVec(accent.color));
      color = COLORS.filter((c) => !c.n).sort((a, b) => V.cos(colorVec(b.id), target) - V.cos(colorVec(a.id), target))[0].id;
    } else color = w[1] > 0.2 ? "beige" : "white";
  }
  const styleId = Object.entries(FORMALITY).sort((a, b) => Math.abs(a[1] - w[0]) - Math.abs(b[1] - w[0]))[0][0];
  const query = `${styleId === "classic" ? "classic " : styleId === "sport" ? "sport " : ""}${COL[color].label} ${noun}`;
  return { query, color, styleId, season: seasonFromY(w[1]), missing: !!missingCat };
}

function renderMe() {
  const M = state.me;
  const can = state.sample && state.canSeeImages;
  let body = "";
  if (M.photo) {
    body += `<div class="me-row"><img src="${M.photo}" alt="Your photo"><div style="min-width:0;display:grid;gap:8px">`;
    if (M.busy) body += `<span class="note">Looking at the photo and picking colours…</span>`;
    else if (M.error) body += `<span class="err">${esc(M.error)}</span>`;
    else if (M.profile) {
      const P = M.profile;
      body += `<div class="tags"><span class="tag">Undertone: ${UNDERTONE[P.undertone]}</span><span class="tag">Contrast: ${CONTRAST[P.contrast]}</span></div>
        <div class="tags">${P.best.map((c) => `<span class="tag"><span class="sw" style="background:${COL[c].hex}"></span>${esc(COL[c].label)}</span>`).join("")}</div>
        ${P.summary ? `<span class="note">${esc(P.summary)}</span>` : ""}`;
    }
    body += `</div></div>`;
    if (M.result && !M.busy) {
      body += `<p class="note">Looks for ${esc(OCC[M.result.opts.occasion]?.label || "today")}, with a bonus for the colours that suit you.</p>`;

      body += renderShop(M.result.shop);

  </div>`;
}

      : `<button class="btn primary block" data-act="save" ${!d.img || extra.saving ? "disabled" : ""}>${extra.saving ? "Saving…" : isNew ? "Add to wardrobe" : "Save changes"}</button>
    ${isNew ? "" : `<button class="btn block" data-act="pin">Build a look with this piece</button>`}
    ${isNew ? "" : extra.confirmDelete ? `<div class="confirm"><span>Delete “${esc(itemName(d))}” from your wardrobe? This cannot be undone.</span><div class="btn-row"><button class="btn" data-act="cancel-del">Keep</button><button class="btn danger" data-act="del">${IC.trash}Delete</button></div></div>` : `<button class="btn danger block ghost" data-act="ask-del">${IC.trash}Delete piece</button>`}`}`);
  document.body.style.overflow = "hidden";
  if (extra.confirmDelete) requestAnimationFrame(() => sheetRoot.querySelector(".confirm")?.scrollIntoView({ block: "nearest" }));
}
function drawLookSheet(l) {
  draft = null; sheetLook = l;
  const items = l.itemIds.map(itemById).filter(Boolean);
  sheetRoot.innerHTML = shell(esc(lookTitle(l)), `
    <div class="look-meta"><span class="eyebrow">${esc(lookMeta(l))}</span>${l.score != null ? `<span class="match">${l.score}% match</span>` : ""}</div>
    ${collage(items)}
    <div class="field"><span class="lbl">In this look · ${items.length} pieces</span>
      <div class="look-items">${items.map((i) => `<figure><img src="${i.img}" alt="${esc(itemName(i))}"><figcaption>${esc(itemName(i))}</figcaption></figure>`).join("")}</div></div>
    ${l.why && l.why.length ? `<div class="field"><span class="lbl">Why it works</span><ul class="why">${l.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
    <div class="btn-row">${l._saved ? `<button class="btn danger" data-sunsave="${esc(l.id)}">${IC.trash}Remove from saved</button>` : l._savable ? `<button class="btn primary" data-ssave>Save look</button>` : ""}<button class="btn" data-close>Close</button></div>`);
  document.body.style.overflow = "hidden";
}
function readDraftFields() {
  if (!draft || draft.example) return;
  const v = (id) => document.getElementById(id)?.value;
  draft.name = (v("f-name") || "").trim().slice(0, 40);
  draft.category = v("f-cat") || draft.category; draft.season = v("f-sea") || draft.season;
  draft.style = v("f-sty") || draft.style; draft.occasion = v("f-occ") || draft.occasion;
}
const lookBody = (l) => { const o = { title: l.title, itemIds: l.itemIds, score: l.score, why: l.why, occasion: l.occasion }; if (l.season) o.season = l.season; return o; };

document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !draft) { if (draft && !draft.img) closeSheet(); return; }
  readDraftFields();
  try { const { dataUrl, blob } = await compress(f); draft.img = dataUrl; draftBlob = blob; drawSheet(); }
  catch (err) { drawSheet({ error: err.message }); }
});

sheetRoot.addEventListener("click", async (e) => {
  if (e.target.id === "overlay") return closeSheet();
  const b = e.target.closest("button"); if (!b) return;
  if (b.hasAttribute("data-close")) return closeSheet();
  if (sheetLook) {
    if (b.hasAttribute("data-ssave")) {
      b.disabled = true;
      try { await saveLook({ ...lookBody(sheetLook), id: newId(), createdAt: Date.now() }); toast("Look saved"); closeSheet(); }
      catch (err) { b.disabled = false; toast("Could not save the look"); }
    } else if (b.dataset.sunsave) {
      try { await removeLook(b.dataset.sunsave); toast("Look removed"); closeSheet(); } catch (err) { toast("Could not remove it"); }
    }
    return;
  }
  if (!draft) return;
  if (b.dataset.color) {
    draft.color = b.dataset.color;
    sheetRoot.querySelectorAll("[data-color]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.color === draft.color));
    document.getElementById("color-name").textContent = COL[draft.color].label; return;
  }
  const act = b.dataset.act; readDraftFields();
  if (act === "photo") document.getElementById("file").click();
  else if (act === "ask-del") drawSheet({ confirmDelete: true });
  else if (act === "cancel-del") drawSheet();
  else if (act === "del") { const name = itemName(draft); try { await removeItem(draft.id); closeSheet(); toast(`“${name}” deleted`); } catch (err) { drawSheet({ error: "Could not delete. Check your connection and try again." }); } }
  else if (act === "pin") { state.gen.pin = draft.id; state.results = generate(state.gen); closeSheet(); go("looks"); }
  else if (act === "add-own") { closeSheet(); openItem(null); }
  else if (act === "ai-tag") {
    drawSheet({ busy: true });
    try {
      const r = await classifyPhoto(draftBlob);
      for (const k of ["category", "color", "season", "style", "occasion"]) if (r[k]) draft[k] = r[k];
      if (r.name && !draft.name) draft.name = r.name;
      drawSheet({ aiNote: "AI filled in the details. Check them and fix anything that is off." });
    } catch (err) { drawSheet({ aiNote: aiErrorText(err) || "Could not recognise the piece. Fill in the details by hand." }); }
  }
  else if (act === "save") {
    if (!draft.img) return drawSheet({ error: "Choose a photo first." });
    drawSheet({ saving: true });
    const item = { ...draft }; const isNew = !state.items.some((i) => i.id === item.id);
    try { await saveItem(item); closeSheet(); if (state.tab !== "wardrobe") go("wardrobe"); toast(isNew ? "Added to your wardrobe" : "Changes saved"); }
    catch (err) { drawSheet({ error: err && err.code === "quota_exceeded" ? "Storage is full. Delete a few items." : "Could not save. Check your connection and try again." }); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (draft || sheetLook)) closeSheet(); });

/* ---------- screen clicks ---------- */
main.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.open) return openItem(b.dataset.open);
  if (b.dataset.del) return openItem(b.dataset.del, { confirmDelete: true });
  if (b.dataset.look) { const l = LOOKS.get(b.dataset.look); if (l) drawLookSheet(l); return; }
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.act === "add") return openItem(null);
  if (b.dataset.filter) { state.filter = state.filter === b.dataset.filter && b.dataset.filter !== "all" ? "all" : b.dataset.filter; render(); if (b.classList.contains("link")) window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (b.dataset.weather) { state.gen.weather = b.dataset.weather; main.querySelectorAll("[data-weather]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.weather === state.gen.weather)); return; }
  if (b.hasAttribute("data-unpin")) { state.gen.pin = null; state.results = null; return render(); }
  if (b.dataset.tip) return send(b.dataset.tip);
  if (b.dataset.ask) { const it = itemById(b.dataset.ask); if (it) { input.value = `What goes with my ${itemName(it).toLowerCase()}?`; input.focus(); input.dispatchEvent(new Event("input")); } return; }
  if (b.dataset.act === "shop") { state.shop = shopSuggestion({ ...state.gen, pin: null }); return render(); }
  if (b.dataset.act === "selfie") return document.getElementById("selfie").click();
  if (b.dataset.save) {
    const l = LOOKS.get(b.dataset.save); if (!l) return;
    b.disabled = true;
    try { await saveLook({ ...lookBody(l), id: newId(), createdAt: Date.now() }); toast("Look saved"); b.textContent = "Saved"; }
    catch (err) { b.disabled = false; toast("Could not save the look"); }
    return;
  }
  if (b.dataset.unsave) { try { await removeLook(b.dataset.unsave); toast("Look removed"); } catch (err) { toast("Could not remove it"); } }
});
main.addEventListener("change", (e) => {
  if (e.target.id === "g-occ") { state.gen.occasion = e.target.value; state.shop = null; }
  if (e.target.id === "g-sea") { state.gen.season = e.target.value; state.shop = null; }
  if (e.target.id === "w-sort") { state.sort = e.target.value; render(); }
});
main.addEventListener("submit", (e) => {
  if (e.target.id !== "gen-form") return;
  e.preventDefault();
  state.shop = null; state.results = generate(state.gen); render();
  requestAnimationFrame(() => document.getElementById("gen-out")?.scrollIntoView({ behavior: "smooth", block: "start" }));
});
document.getElementById("selfie").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !state.sample) return;
  const M = state.me;
  Object.assign(M, { busy: true, error: "", profile: null, result: null });
  let blob;
  try { const c = await compress(f); M.photo = c.dataUrl; blob = c.blob; } catch (err) { M.busy = false; M.error = err.message; return render(); }
  render();
  try {
    const prof = await analyzeSelfie(blob);
    if (prof.noPerson) M.error = "There is no person visible in the photo. Try one that shows you at least from the waist up.";
    else {
      M.profile = prof;
      const opts = meOpts(prof);
      M.result = { opts, r: generate(opts, 2), shop: shopSuggestion(opts) };
    }
  } catch (err) { M.error = aiErrorText(err) || "Could not read the photo."; }
  M.busy = false; render();
});

/* ---------- chat ---------- */
const input = document.getElementById("chat-input");
let busy = false;
async function send(text) {
  text = (text || "").trim(); if (!text || busy) return;
  busy = true; input.value = ""; input.style.height = "";
  try { await askStylist(text); } finally { busy = false; }
}
document.getElementById("chat-send").addEventListener("click", () => send(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; });

let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}

route();
setStatus();
initStorage();
initAI();
})();
</script>
</body>
</html>
