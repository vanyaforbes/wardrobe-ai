<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0E">
<meta name="description" content="Wardrobe AI: your digital wardrobe and personal AI stylist.">
<title>Wardrobe AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" data-tab="home"><b>Wardrobe</b><span>AI</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="#home" data-tab="home" data-i18n="nav.home">Home</a>
      <a href="#wardrobe" data-tab="wardrobe" data-i18n="nav.wardrobe">Wardrobe</a>
      <a href="#outfits" data-tab="outfits" data-i18n="nav.outfits">Outfits</a>
      <a href="#styles" data-tab="styles" data-i18n="nav.styles">Styles</a>
      <a href="#shop" data-tab="shop" data-i18n="nav.shop">Shop</a>
      <a href="#stylist" data-tab="stylist" data-i18n="nav.stylist">AI Stylist</a>
      <a href="#profile" data-tab="profile" data-i18n="nav.profile">Profile</a>
    </nav>
    <div class="top-right">
      <span id="status" class="status" aria-live="polite"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-setlang="en" aria-pressed="true">EN</button>
        <button type="button" data-setlang="ru" aria-pressed="false">RU</button>
      </div>
      <a id="avatar" class="avatar" href="#profile" data-tab="profile" data-i18n-aria="nav.profile" aria-label="Profile"></a>
    </div>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1"></main>

<div id="composer" class="composer" hidden>
  <div class="wrap"><div class="box">
    <textarea id="chat-input" rows="1" data-i18n-ph="stylist.placeholder" placeholder="Ask the stylist…"></textarea>
    <button id="chat-send" class="btn primary" type="button" data-i18n-aria="btn.send" aria-label="Send"><svg stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div></div>
</div>

<nav class="nav" aria-label="Sections">
  <div class="wrap">
    <a href="#home" data-tab="home"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20H4z"/><path d="M10 20v-6h4v6"/></svg><span data-i18n="nav.home">Home</span></a>
    <a href="#wardrobe" data-tab="wardrobe"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.2a2 2 0 1 1 2-2"/><path d="M12 7.2v1L3 15.5h18L12 8.2"/></svg><span data-i18n="nav.wardrobe">Wardrobe</span></a>
    <a href="#outfits" data-tab="outfits"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="7" height="17" rx="1"/><rect x="13" y="3.5" width="7" height="8" rx="1"/><rect x="13" y="13.5" width="7" height="7" rx="1"/></svg><span data-i18n="nav.outfits">Outfits</span></a>
    <a href="#styles" data-tab="styles"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17"/><path d="M6 6c3.5 2.5 8.5 2.5 12 0M6 18c3.5-2.5 8.5-2.5 12 0"/></svg><span data-i18n="nav.styles">Styles</span></a>
    <a href="#shop" data-tab="shop"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.4 13H5.4z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg><span data-i18n="nav.shop">Shop</span></a>
    <a href="#stylist" data-tab="stylist"><svg stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span data-i18n="nav.stylist">AI Stylist</span></a>
  </div>
</nav>

<div id="sheet-root"></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="selfie" type="file" accept="image/*" hidden>

<script src="assets/i18n.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
